name: web-accessibility-ci

on:
  push:
    branches: [ main, main_ofc ]
  pull_request:
    branches: [ main, main_ofc ]

jobs:
  web-checks:
    name: Web checks (form ids + lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run web checks
        working-directory: ./web
        run: |
          npm ci
          npm run check:form-ids
          npm run lint --silent
        env:
          CI: true
