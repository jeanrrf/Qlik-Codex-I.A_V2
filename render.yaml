services:
  - type: web
    name: qlik-codex-ia-server
    env: node
    plan: free
    rootDirectory: server
    buildCommand: npm install && npm run build && cd ../web && npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL_NAME
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: OWNER_ACCESS_TOKEN
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: VITE_OWNER_EMAIL
        sync: false
