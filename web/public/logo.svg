        <text x="280" y="140" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-1">
            <tspan x="280" dy="0">Qlik</tspan>
            <tspan x="280" dy="92">Codex I.A.</tspan>
        </text>
    </g>
</svg>