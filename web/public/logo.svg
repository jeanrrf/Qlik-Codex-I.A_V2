<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="logoTitle logoDesc">
    <title id="logoTitle">Qlik Codex I.A.</title>
    <desc id="logoDesc">Marca com raio branco à esquerda e tipografia em branco à direita sobre fundo preto.</desc>
    <rect width="640" height="320" fill="#000"/>

    <g fill="#fff" aria-hidden="true">
