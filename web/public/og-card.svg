<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05080F" />
      <stop offset="0.5" stop-color="#0A1224" />
      <stop offset="1" stop-color="#07101A" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 120) rotate(90) scale(420 520)">
      <stop stop-color="#00F2FF" stop-opacity="0.45" />
      <stop offset="1" stop-color="#00F2FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00F2FF" />
      <stop offset="1" stop-color="#7A5CFF" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#00F2FF" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g stroke="#0f1b2f" stroke-width="1" opacity="0.5">
    <path d="M120 0V630" />
    <path d="M300 0V630" />
    <path d="M480 0V630" />
    <path d="M660 0V630" />
    <path d="M840 0V630" />
    <path d="M1020 0V630" />
    <path d="M0 120H1200" />
    <path d="M0 260H1200" />
    <path d="M0 400H1200" />
    <path d="M0 540H1200" />
  </g>

  <circle cx="180" cy="140" r="14" fill="#00F2FF" fill-opacity="0.35" />
  <circle cx="220" cy="500" r="10" fill="#7A5CFF" fill-opacity="0.32" />
  <circle cx="1030" cy="340" r="8" fill="#00FF9D" fill-opacity="0.4" />

  <g filter="url(#shadow)">
    <rect x="120" y="140" width="960" height="350" rx="28" fill="rgba(7, 10, 20, 0.75)" stroke="rgba(0, 242, 255, 0.18)" />
  </g>

  <text x="160" y="240" fill="#00F2FF" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="0.08em">QLIK CODEX I.A</text>
  <text x="160" y="292" fill="#FFFFFF" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="800">IA para otimizar scripts Qlik</text>
  <text x="160" y="338" fill="#9FB3D0" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500">Análise, refatoração e documentação em segundos, com segurança.</text>

  <g transform="translate(160 380)">
    <rect width="220" height="64" rx="14" fill="url(#accent)" />
    <text x="20" y="40" fill="#01060E" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800">Teste gratuito</text>
    <text x="165" y="40" fill="#01060E" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700">4/dia</text>
  </g>

  <g transform="translate(420 384)">
    <circle cx="18" cy="18" r="18" fill="rgba(0, 255, 157, 0.16)" stroke="#00FF9D" stroke-width="1.5" />
    <path d="M12 18l6 6 10-14" fill="none" stroke="#00FF9D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="44" y="24" fill="#E8F3FF" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700">Compatível com Qlik Sense & Cloud</text>
  </g>

  <g transform="translate(420 430)">
    <circle cx="18" cy="18" r="18" fill="rgba(0, 242, 255, 0.16)" stroke="#00F2FF" stroke-width="1.5" />
    <path d="M12 18l6 6 10-14" fill="none" stroke="#00F2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="44" y="24" fill="#E8F3FF" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700">Foco em performance e segurança</text>
  </g>
</svg>
